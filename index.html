<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MODS·GE — 3D ტიუნინგი</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="logo" data-go="home" aria-label="მთავარი"><b>MODS</b><i>GE</i></button>
  <nav id="nav">
    <button data-go="home" class="on">მთავარი</button>
    <button data-go="lab">3D ლაბორატორია</button>
    <button data-go="mine">ჩემი ბილდები</button>
  </nav>
  <button id="theme" class="ic" aria-label="თემის შეცვლა">☀</button>
</header>

<main>
  <section id="home" class="view on">
    <div class="head"><h1>ავტომობილები</h1><span class="tabs"><b>Spotlight</b></span><button class="cta" data-go="lab">+ დაამატე შენი მანქანა</button></div>
    <div class="grid" id="cars"></div>
    <div class="head"><h1>ბილდები</h1><span class="tabs"><b>ყველაზე პოპულარული სტილები</b></span></div>
    <div class="grid small" id="styles"></div>
  </section>

  <section id="lab" class="view">
    <div class="labgrid">
      <div class="stagecard">
        <div class="stage" id="stage">
          <canvas id="c" aria-label="მანქანის 3D მოდელი"></canvas>
          <div class="chip" id="chip"></div>
          <div class="views" id="views"><button data-view="front">წინ</button><button data-view="side">გვერდი</button><button data-view="rear">უკან</button><button data-view="top">ზემოდან</button></div>
          <div class="toast" id="toast" role="status"></div>
        </div>
        <div class="bar">
          <button id="rand">შემთხვევითი</button><button id="save">შენახვა</button><button id="share">ბმული</button><button id="shot">PNG</button><button id="reset">საწყისზე</button>
        </div>
      </div>
      <aside class="side">
        <div class="cats" id="cats" role="tablist"></div>
        <div id="groups"></div>
      </aside>
    </div>
  </section>

  <section id="mine" class="view">
    <div class="head"><h1>ჩემი ბილდები</h1></div>
    <div class="grid small" id="mylist"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
